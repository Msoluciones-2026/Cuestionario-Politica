<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario - Política Integrada MSoluciones (v2)</title>
<style>
  :root{
    --dark-green:#1C3423;
    --medium-green:#67A97B;
    --medium-light-green:#6BB080;
    --light-green:#A4C868;
    --bg-whitish:#F4F8EC;
    --card-bg:#ffffff;
    --incorrect:#c65b4e;
    --incorrect-bg:#fbe8e5;
  }
  *{box-sizing:border-box;}
  html{ font-size:clamp(14px, 1vw + 10px, 17px); }
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg-whitish);
    color:var(--dark-green);
    padding-bottom:clamp(30px, 6vw, 60px);
  }
  header{
    background:linear-gradient(180deg, #ffffff 0%, var(--bg-whitish) 100%);
    padding:clamp(18px, 4vw, 30px) clamp(14px, 4vw, 24px) clamp(14px, 3vw, 22px);
    text-align:center;
    border-bottom:6px solid;
    border-image:linear-gradient(90deg, var(--dark-green), var(--medium-green), var(--light-green)) 1;
    box-shadow:0 2px 10px rgba(28,52,35,0.08);
  }
  header img{
    max-width:340px;
    width:min(80%, 320px);
    height:auto;
  }
  header h1{
    color:var(--dark-green);
    margin:clamp(10px, 2vw, 16px) 0 6px;
    font-size:clamp(1.15rem, 1.6vw + 0.8rem, 1.7rem);
    letter-spacing:0.3px;
  }
  header p{
    color:var(--medium-light-green);
    margin:0;
    font-size:clamp(0.85rem, 0.6vw + 0.7rem, 1.05rem);
    font-weight:600;
  }
  main{
    max-width:900px;
    width:100%;
    margin:0 auto;
    padding:clamp(16px, 4vw, 24px) clamp(12px, 4vw, 18px);
  }
  .instructions{
    background:var(--card-bg);
    border-left:6px solid var(--light-green);
    border-radius:10px;
    padding:clamp(12px, 2.5vw, 16px) clamp(14px, 3vw, 20px);
    margin-bottom:clamp(16px, 3vw, 22px);
    box-shadow:0 2px 8px rgba(28,52,35,0.08);
    font-size:clamp(0.85rem, 0.4vw + 0.75rem, 0.95rem);
  }
  .card{
    position:relative;
    background:var(--card-bg);
    border-radius:12px;
    padding:clamp(14px, 3vw, 20px) clamp(14px, 4vw, 22px);
    margin-bottom:clamp(10px, 2vw, 14px);
    box-shadow:0 2px 8px rgba(28,52,35,0.08);
    border-top:4px solid var(--light-green);
  }
  .card .sentence{
    line-height:1.9;
    font-size:clamp(0.95rem, 0.4vw + 0.85rem, 1.08rem);
    margin-bottom:14px;
  }
  .num{
    display:inline-block;
    background:var(--dark-green);
    color:#fff;
    width:26px;
    height:26px;
    border-radius:50%;
    text-align:center;
    line-height:26px;
    font-size:0.85rem;
    font-weight:700;
    margin-right:8px;
    flex-shrink:0;
  }
  .blank-visual{
    display:inline-block;
    min-width:60px;
    border-bottom:3px solid var(--medium-green);
    color:transparent;
    margin:0 2px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
    border:2px solid transparent;
    border-radius:10px;
    padding:6px;
    transition:border-color .2s ease, background-color .2s ease;
  }
  .options.incomplete{
    border-color:var(--incorrect);
    background-color:var(--incorrect-bg);
  }
  .option-label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:var(--bg-whitish);
    border:2px solid transparent;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:clamp(0.85rem, 0.35vw + 0.78rem, 0.98rem);
    transition:border-color .15s ease, background-color .15s ease;
  }
  .options.incomplete .option-label{
    background:#ffffff;
  }
  .option-label:hover{
    border-color:var(--light-green);
  }
  .option-label input[type="radio"]{
    margin-top:3px;
    accent-color:var(--medium-green);
    flex-shrink:0;
    width:16px;
    height:16px;
  }
  .option-label input[type="radio"]:checked ~ .option-text{
    color:var(--dark-green);
    font-weight:700;
  }
  .option-label:has(input:checked){
    border-color:var(--medium-green);
    background:#e9f4e3;
  }
  .option-label:has(input:disabled){
    cursor:not-allowed;
    opacity:0.85;
  }
  .option-letter{
    font-weight:700;
    color:var(--medium-light-green);
  }

  .field-group{
    margin-bottom:14px;
  }
  .field-group:last-child{ margin-bottom:0; }
  .field-group label{
    display:block;
    font-weight:700;
    font-size:0.85rem;
    color:var(--dark-green);
    margin-bottom:4px;
  }
  .contact-input{
    width:100%;
    padding:10px 14px;
    border:2px solid var(--medium-green);
    border-radius:8px;
    font-family:inherit;
    font-size:0.95rem;
    color:var(--dark-green);
    background-color:var(--bg-whitish);
    transition:border-color .2s ease, background-color .2s ease;
  }
  .contact-input:focus{
    outline:none;
    border-color:var(--light-green);
    box-shadow:0 0 0 3px rgba(164,200,104,0.35);
  }
  .contact-input.incorrect{
    border-color:var(--incorrect);
    background-color:var(--incorrect-bg);
  }
  .contact-input:disabled{
    opacity:0.8;
    cursor:not-allowed;
  }

  .reveal{
    background:var(--bg-whitish);
    border-left:6px solid var(--medium-green);
    border-radius:10px;
    padding:clamp(10px, 2.5vw, 14px) clamp(14px, 3vw, 18px);
    margin:0 0 clamp(10px, 2vw, 14px);
    font-size:clamp(0.88rem, 0.35vw + 0.8rem, 1rem);
    line-height:1.6;
    display:none;
  }
  .reveal.visible{ display:block; }
  .reveal .reveal-label{
    display:block;
    font-weight:700;
    color:var(--medium-light-green);
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-bottom:4px;
  }
  .reveal strong{ color:var(--dark-green); }

  .correct-feedback{
    display:none;
    align-items:center;
    gap:6px;
    position:absolute;
    top:-12px;
    right:14px;
    z-index:2;
    background:#fff;
    border:2px solid var(--medium-green);
    border-radius:20px;
    padding:3px 12px 3px 6px;
    font-size:0.82rem;
    font-weight:700;
    color:var(--medium-light-green);
    box-shadow:0 2px 6px rgba(28,52,35,0.18);
  }
  .correct-feedback.visible{ display:flex; }
  .correct-feedback .check-icon{
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--medium-green);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.72rem;
    flex-shrink:0;
  }

  .actions{
    display:flex;
    gap:12px;
    justify-content:center;
    margin:clamp(20px, 4vw, 26px) 0 10px;
    flex-wrap:wrap;
  }
  button{
    border:none;
    padding:12px 26px;
    border-radius:24px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #checkBtn{
    background:linear-gradient(135deg, var(--medium-light-green), var(--dark-green));
    color:#fff;
  }
  button:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(28,52,35,0.25); }

  #result{
    text-align:center;
    font-size:clamp(0.95rem, 0.4vw + 0.85rem, 1.1rem);
    font-weight:700;
    margin-top:10px;
    min-height:28px;
  }
  footer{
    text-align:center;
    color:var(--medium-green);
    font-size:0.8rem;
    margin-top:30px;
  }
</style>
</head>
<body>

<header>
  <img src="logo-msoluciones.png" alt="Logo MSoluciones - Servicios y Mantenciones">
  <h1>Cuestionario de Política Integrada</h1>
</header>

<main>
  <div class="instructions">
    <strong>Instrucciones:</strong> Cada oración tiene un espacio en blanco. Elige la alternativa (a, b o c) que
    contiene la combinación correcta de palabras para completarla y presiona <em>Enviar respuestas</em>.
  </div>

  <div class="card contact-card" id="contactCard">
    <div class="sentence" style="margin-bottom:14px;"><span class="num">0</span>Tus datos</div>
    <div class="field-group">
      <label for="nameInput">Nombre completo</label>
      <input type="text" id="nameInput" class="contact-input" placeholder="Ej: Juan Pérez" autocomplete="name">
    </div>
    <div class="field-group">
      <label for="emailInput">Correo corporativo</label>
      <input type="email" id="emailInput" class="contact-input" placeholder="nombre@empresa.com" autocomplete="email">
    </div>
  </div>

  <div id="sentences"></div>

  <div class="actions">
    <button id="checkBtn">Enviar respuestas</button>
  </div>
  <div id="result"></div>

  <footer>MSoluciones — Servicios y Mantenciones</footer>
</main>

<script>
// Each sentence: text with {blank} markers for missing words, plus the correct
// word list and two simple, clearly-wrong word combinations (distractor1/distractor2).
const sentences = [
  {
    template: "Satisfacer las {blank} de los clientes cumpliendo con sus estándares y {blank}.",
    correct: ["necesidades", "exigencias"],
    distractor1: ["sueldos", "uniformes"],
    distractor2: ["turnos", "agendas"]
  },
  {
    template: "Cumplir con toda la {blank} {blank} que nos aplica.",
    correct: ["normativa", "vigente"],
    distractor1: ["papel", "mensual"],
    distractor2: ["sello", "semanal"]
  },
  {
    template: "Cuidar el medio ambiente previniendo la {blank} y controlando el impacto {blank} de lo que hacemos.",
    correct: ["contaminación", "ambiental"],
    distractor1: ["tráfico", "sueldo"],
    distractor2: ["clima", "folleto"]
  },
  {
    template: "Identificar y eliminar los {blank} antes de que ocurra un {blank}.",
    correct: ["peligros", "accidente"],
    distractor1: ["sellos", "bono"],
    distractor2: ["carteles", "ascenso"]
  },
  {
    template: "Proporcionar la {blank} y {blank} de todos los colaboradores porque su participación hace más seguro el trabajo.",
    correct: ["participación", "consulta"],
    distractor1: ["uniforme", "bono"],
    distractor2: ["clima", "permiso"]
  },
  {
    template: "Gestionar los riesgos de forma {blank}, con controles y medidas preventivas que aseguren la continuidad de nuestras {blank}.",
    correct: ["proactiva", "operaciones"],
    distractor1: ["diario", "correos"],
    distractor2: ["semanal", "muebles"]
  },
  {
    template: "Analizar, {blank} y actuar para ser mejores cada día.",
    correct: ["prevenir"],
    distractor1: ["cobrar"],
    distractor2: ["viajar"]
  },
  {
    template: "Integrar prácticas de {blank} y eficiencia energética en nuestras operaciones.",
    correct: ["innovación"],
    distractor1: ["recursos"],
    distractor2: ["muebles"]
  },
  {
    template: "Garantizar entornos laborales libres de {blank} y {blank}, con gestión de riesgos psicosociales con perspectiva de género.",
    correct: ["acoso", "violencia"],
    distractor1: ["trabajo", "responsabilidades"],
    distractor2: ["tecnología", "celulares"]
  },
  {
    template: "Fortalecer {blank} en calidad, seguridad, salud y medio ambiente, promoviendo el compromiso con los objetivos del SGI.",
    correct: ["competencias"],
    distractor1: ["corporaciones"],
    distractor2: ["relaciones"]
  }
];

const sentencesDiv = document.getElementById('sentences');
const nameInput = document.getElementById('nameInput');
const emailInput = document.getElementById('emailInput');
const contactCard = document.getElementById('contactCard');
const checkBtn = document.getElementById('checkBtn');
const result = document.getElementById('result');
const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const STORAGE_KEY = 'msoluciones_cuestionario_v2_state';
const letters = ['a', 'b', 'c'];
let submitted = false;

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderSentenceText(template, correctWords){
  let i = 0;
  const parts = template.split('{blank}');
  let html = '';
  parts.forEach((part, idx) => {
    html += part;
    if (idx < parts.length - 1) {
      const width = Math.max(50, correctWords[i].length * 9);
      html += `<span class="blank-visual" style="min-width:${width}px">${correctWords[i]}</span>`;
      i++;
    }
  });
  return html;
}

function buildOptions(sentence){
  const options = shuffle([
    { words: sentence.correct, isCorrect: true, kind: 'correct' },
    { words: sentence.distractor1, isCorrect: false, kind: 'distractor1' },
    { words: sentence.distractor2, isCorrect: false, kind: 'distractor2' }
  ]);
  return options;
}

function renderSentences(){
  sentencesDiv.innerHTML = '';
  sentences.forEach((s, sIndex) => {
    const card = document.createElement('div');
    card.className = 'card';

    const sentenceEl = document.createElement('div');
    sentenceEl.className = 'sentence';
    const numSpan = `<span class="num">${sIndex + 1}</span>`;
    sentenceEl.innerHTML = numSpan + renderSentenceText(s.template, s.correct);
    card.appendChild(sentenceEl);

    const optionsEl = document.createElement('div');
    optionsEl.className = 'options';
    optionsEl.dataset.question = sIndex;

    const options = buildOptions(s);
    options.forEach((opt, optIndex) => {
      const label = document.createElement('label');
      label.className = 'option-label';

      const input = document.createElement('input');
      input.type = 'radio';
      input.name = `q${sIndex}`;
      input.value = optIndex;
      input.dataset.kind = opt.kind;
      if (opt.isCorrect) input.dataset.correct = 'true';
      input.addEventListener('change', () => {
        optionsEl.classList.remove('incomplete');
        saveState();
      });

      const textSpan = document.createElement('span');
      textSpan.className = 'option-text';
      textSpan.innerHTML = `<span class="option-letter">${letters[optIndex]})</span> ${opt.words.join(', ')}`;

      label.appendChild(input);
      label.appendChild(textSpan);
      optionsEl.appendChild(label);
    });

    const correctFeedback = document.createElement('div');
    correctFeedback.className = 'correct-feedback';
    correctFeedback.id = `correct-${sIndex}`;
    correctFeedback.innerHTML = `<span class="check-icon">&#10003;</span> Correcto`;
    card.appendChild(correctFeedback);

    card.appendChild(optionsEl);
    sentencesDiv.appendChild(card);

    const reveal = document.createElement('div');
    reveal.className = 'reveal';
    reveal.id = `reveal-${sIndex}`;
    const filled = s.template.split('{blank}').reduce((acc, part, idx, arr) => {
      acc += part;
      if (idx < arr.length - 1) acc += `<strong>${s.correct[idx]}</strong>`;
      return acc;
    }, '');
    reveal.innerHTML = `<span class="reveal-label">Combinación correcta</span>${filled}`;
    sentencesDiv.appendChild(reveal);
  });
}

function saveState(){
  const optionGroups = Array.from(document.querySelectorAll('.options'));
  const state = {
    name: nameInput.value,
    email: emailInput.value,
    answers: optionGroups.map(group => {
      const checked = group.querySelector('input[type="radio"]:checked');
      return checked ? checked.dataset.kind : null;
    }),
    submitted
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function clearContactInvalid(){
  nameInput.classList.remove('incorrect');
  emailInput.classList.remove('incorrect');
}

function validateContact(){
  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  if (!name || !email) return { ok:false, reason:'empty' };
  if (!emailRegex.test(email)) return { ok:false, reason:'invalid' };
  return { ok:true, reason:null };
}

function markContactInvalid(){
  if (!nameInput.value.trim()) nameInput.classList.add('incorrect');
  if (!emailInput.value.trim() || !emailRegex.test(emailInput.value.trim())) emailInput.classList.add('incorrect');
}

nameInput.addEventListener('input', () => { nameInput.classList.remove('incorrect'); saveState(); });
emailInput.addEventListener('input', () => { emailInput.classList.remove('incorrect'); saveState(); });

function finalizeSubmission(){
  const optionGroups = Array.from(document.querySelectorAll('.options'));

  let correctCount = 0;
  optionGroups.forEach(group => {
    const qIndex = Number(group.dataset.question);
    const checked = group.querySelector('input[type="radio"]:checked');
    const isCorrect = checked.dataset.correct === 'true';
    group.classList.remove('incomplete');
    if (isCorrect) {
      correctCount++;
      document.getElementById(`correct-${qIndex}`).classList.add('visible');
    } else {
      group.classList.add('incomplete');
      document.getElementById(`reveal-${qIndex}`).classList.add('visible');
    }
    group.querySelectorAll('input[type="radio"]').forEach(input => { input.disabled = true; });
  });

  result.textContent = `Enviaste tus respuestas: ${correctCount} de ${optionGroups.length} correctas.`;
  result.style.color = correctCount === optionGroups.length ? 'var(--medium-light-green)' : 'var(--dark-green)';

  nameInput.disabled = true;
  emailInput.disabled = true;
  checkBtn.style.display = 'none';

  submitted = true;
  saveState();
}

checkBtn.addEventListener('click', () => {
  const optionGroups = Array.from(document.querySelectorAll('.options'));

  optionGroups.forEach(group => group.classList.remove('incomplete'));
  clearContactInvalid();
  document.querySelectorAll('.reveal').forEach(r => r.classList.remove('visible'));
  document.querySelectorAll('.correct-feedback').forEach(c => c.classList.remove('visible'));

  const contactStatus = validateContact();
  const missingQuestionIndices = [];
  optionGroups.forEach((group, idx) => {
    const checked = group.querySelector('input[type="radio"]:checked');
    if (!checked) missingQuestionIndices.push(idx);
  });

  const problems = [];
  if (!contactStatus.ok) problems.push(0);
  missingQuestionIndices.forEach(i => problems.push(i + 1));

  if (problems.length > 0) {
    let targetEl;
    if (problems[0] === 0) {
      markContactInvalid();
      targetEl = contactCard;
    } else {
      targetEl = optionGroups[problems[0] - 1];
      targetEl.classList.add('incomplete');
    }

    if (problems[0] === 0 && contactStatus.reason === 'invalid') {
      result.textContent = problems.length > 1
        ? `Ingresa un correo válido. También faltan respuestas en la(s) pregunta(s): ${problems.slice(1).join(', ')}.`
        : 'Ingresa un correo válido.';
    } else {
      const labels = problems.map(p => p === 0 ? 'tus datos' : p);
      result.textContent = `Faltan respuestas por elegir en: ${labels.join(', ')}.`;
    }
    result.style.color = 'var(--incorrect)';

    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    saveState();
    return;
  }

  finalizeSubmission();
});

function restoreState(){
  const params = new URLSearchParams(location.search);
  if (params.has('reset')) {
    localStorage.removeItem(STORAGE_KEY);
    return;
  }

  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;

  let state;
  try { state = JSON.parse(raw); } catch (e) { return; }

  nameInput.value = state.name || '';
  emailInput.value = state.email || '';

  const optionGroups = Array.from(document.querySelectorAll('.options'));
  optionGroups.forEach((group, idx) => {
    const kind = state.answers && state.answers[idx];
    if (!kind) return;
    const input = group.querySelector(`input[data-kind="${kind}"]`);
    if (input) input.checked = true;
  });

  if (state.submitted) {
    finalizeSubmission();
  }
}

renderSentences();
restoreState();
</script>

</body>
</html>
