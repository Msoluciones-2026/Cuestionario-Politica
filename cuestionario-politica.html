<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario - Política Integrada MSoluciones</title>
<style>
  :root{
    --dark-green:#1C3423;
    --medium-green:#67A97B;
    --medium-light-green:#6BB080;
    --light-green:#A4C868;
    --bg-whitish:#F4F8EC;
    --card-bg:#ffffff;
    --incorrect:#c65b4e;
    --incorrect-bg:#fbe8e5;
  }
  *{box-sizing:border-box;}
  html{ font-size:clamp(14px, 1vw + 10px, 17px); }
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg-whitish);
    color:var(--dark-green);
    padding-bottom:clamp(30px, 6vw, 60px);
  }
  header{
    background:linear-gradient(180deg, #ffffff 0%, var(--bg-whitish) 100%);
    padding:clamp(18px, 4vw, 30px) clamp(14px, 4vw, 24px) clamp(14px, 3vw, 22px);
    text-align:center;
    border-bottom:6px solid;
    border-image:linear-gradient(90deg, var(--dark-green), var(--medium-green), var(--light-green)) 1;
    box-shadow:0 2px 10px rgba(28,52,35,0.08);
  }
  header img{
    max-width:340px;
    width:min(80%, 320px);
    height:auto;
  }
  header h1{
    color:var(--dark-green);
    margin:clamp(10px, 2vw, 16px) 0 6px;
    font-size:clamp(1.15rem, 1.6vw + 0.8rem, 1.7rem);
    letter-spacing:0.3px;
  }
  header p{
    color:var(--medium-light-green);
    margin:0;
    font-size:clamp(0.85rem, 0.6vw + 0.7rem, 1.05rem);
    font-weight:600;
  }
  main{
    max-width:900px;
    width:100%;
    margin:0 auto;
    padding:clamp(16px, 4vw, 24px) clamp(12px, 4vw, 18px);
  }
  .instructions{
    background:var(--card-bg);
    border-left:6px solid var(--light-green);
    border-radius:10px;
    padding:clamp(12px, 2.5vw, 16px) clamp(14px, 3vw, 20px);
    margin-bottom:clamp(16px, 3vw, 22px);
    box-shadow:0 2px 8px rgba(28,52,35,0.08);
    font-size:clamp(0.85rem, 0.4vw + 0.75rem, 0.95rem);
  }
  .card{
    position:relative;
    background:var(--card-bg);
    border-radius:12px;
    padding:clamp(14px, 3vw, 20px) clamp(14px, 4vw, 22px);
    margin-bottom:clamp(10px, 2vw, 14px);
    box-shadow:0 2px 8px rgba(28,52,35,0.08);
    border-top:4px solid var(--light-green);
  }
  .card .sentence{
    line-height:2.5;
    font-size:clamp(0.95rem, 0.4vw + 0.85rem, 1.08rem);
    margin-bottom:2px;
  }
  .num{
    display:inline-block;
    background:var(--dark-green);
    color:#fff;
    width:26px;
    height:26px;
    border-radius:50%;
    text-align:center;
    line-height:26px;
    font-size:0.85rem;
    font-weight:700;
    margin-right:8px;
  }
  .blank-select{
    appearance:none;
    -webkit-appearance:none;
    font-family:inherit;
    font-weight:700;
    font-size:clamp(0.82rem, 0.3vw + 0.75rem, 0.95rem);
    color:var(--dark-green);
    background-color:var(--bg-whitish);
    border:2px solid var(--medium-green);
    border-radius:8px;
    padding:5px 28px 5px 10px;
    margin:3px 3px;
    cursor:pointer;
    max-width:100%;
    min-width:clamp(110px, 22vw, 160px);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231C3423'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat;
    background-position:right 8px center;
    background-size:16px;
    transition:border-color .2s ease, background-color .2s ease;
  }
  .blank-select:focus{
    outline:none;
    border-color:var(--light-green);
    box-shadow:0 0 0 3px rgba(164,200,104,0.35);
  }
  .blank-select.incorrect{
    border-color:var(--incorrect);
    background-color:var(--incorrect-bg);
    color:var(--incorrect);
  }
  .blank-select:disabled{
    opacity:0.8;
    cursor:not-allowed;
  }

  .field-group{
    margin-bottom:14px;
  }
  .field-group:last-child{ margin-bottom:0; }
  .field-group label{
    display:block;
    font-weight:700;
    font-size:0.85rem;
    color:var(--dark-green);
    margin-bottom:4px;
  }
  .contact-input{
    width:100%;
    padding:10px 14px;
    border:2px solid var(--medium-green);
    border-radius:8px;
    font-family:inherit;
    font-size:0.95rem;
    color:var(--dark-green);
    background-color:var(--bg-whitish);
    transition:border-color .2s ease, background-color .2s ease;
  }
  .contact-input:focus{
    outline:none;
    border-color:var(--light-green);
    box-shadow:0 0 0 3px rgba(164,200,104,0.35);
  }
  .contact-input.incorrect{
    border-color:var(--incorrect);
    background-color:var(--incorrect-bg);
  }
  .contact-input:disabled{
    opacity:0.8;
    cursor:not-allowed;
  }

  .reveal{
    background:var(--bg-whitish);
    border-left:6px solid var(--medium-green);
    border-radius:10px;
    padding:clamp(10px, 2.5vw, 14px) clamp(14px, 3vw, 18px);
    margin:0 0 clamp(10px, 2vw, 14px);
    font-size:clamp(0.88rem, 0.35vw + 0.8rem, 1rem);
    line-height:1.6;
    display:none;
  }
  .reveal.visible{ display:block; }
  .reveal .reveal-label{
    display:block;
    font-weight:700;
    color:var(--medium-light-green);
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-bottom:4px;
  }
  .reveal strong{ color:var(--dark-green); }

  .correct-feedback{
    display:none;
    align-items:center;
    gap:6px;
    position:absolute;
    top:-12px;
    right:14px;
    z-index:2;
    background:#fff;
    border:2px solid var(--medium-green);
    border-radius:20px;
    padding:3px 12px 3px 6px;
    font-size:0.82rem;
    font-weight:700;
    color:var(--medium-light-green);
    box-shadow:0 2px 6px rgba(28,52,35,0.18);
  }
  .correct-feedback.visible{ display:flex; }
  .correct-feedback .check-icon{
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--medium-green);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.72rem;
    flex-shrink:0;
  }

  .actions{
    display:flex;
    gap:12px;
    justify-content:center;
    margin:clamp(20px, 4vw, 26px) 0 10px;
    flex-wrap:wrap;
  }
  button{
    border:none;
    padding:12px 26px;
    border-radius:24px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #checkBtn{
    background:linear-gradient(135deg, var(--medium-light-green), var(--dark-green));
    color:#fff;
  }
  button:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(28,52,35,0.25); }

  #result{
    text-align:center;
    font-size:clamp(0.95rem, 0.4vw + 0.85rem, 1.1rem);
    font-weight:700;
    margin-top:10px;
    min-height:28px;
  }
  footer{
    text-align:center;
    color:var(--medium-green);
    font-size:0.8rem;
    margin-top:30px;
  }

  @media (max-width:480px){
    .blank-select{ min-width:100%; }
    .num{ margin-bottom:4px; }
  }
</style>
</head>
<body>

<header>
  <img src="logo-msoluciones.png" alt="Logo MSoluciones - Servicios y Mantenciones">
  <h1>Cuestionario de Política Integrada</h1>
</header>

<main>
  <div class="instructions">
    <strong>Instrucciones:</strong> Responde cada pregunta seleccionando la alternativa correcta en el menú
    desplegable. Debes completar todas antes de poder enviar.
  </div>

  <div class="card contact-card" id="contactCard">
    <div class="sentence" style="margin-bottom:14px;"><span class="num">0</span>Tus datos</div>
    <div class="field-group">
      <label for="nameInput">Nombre completo</label>
      <input type="text" id="nameInput" class="contact-input" placeholder="Ej: Juan Pérez" autocomplete="name">
    </div>
    <div class="field-group">
      <label for="emailInput">Correo corporativo</label>
      <input type="email" id="emailInput" class="contact-input" placeholder="nombre@empresa.com" autocomplete="email">
    </div>
  </div>

  <div id="sentences"></div>

  <div class="actions">
    <button id="checkBtn">Enviar respuestas</button>
  </div>
  <div id="result"></div>

  <footer>MSoluciones — Servicios y Mantenciones</footer>
</main>

<script>
const sentences = [
  { parts: ["Satisfacer las ", 0, " de los clientes cumpliendo con sus estándares y ", 1, "."],
    blanks: [
      { answer: "necesidades", credible: "sueldos", unrelated: "turnos" },
      { answer: "exigencias", credible: "uniformes", unrelated: "agendas" }
    ] },
  { parts: ["Cumplir con toda la ", 0, " ", 1, " que nos aplica."],
    blanks: [
      { answer: "normativa", credible: "papel", unrelated: "sello" },
      { answer: "vigente", credible: "mensual", unrelated: "semanal" }
    ] },
  { parts: ["Cuidar el medio ambiente previniendo la ", 0, " y controlando el impacto ", 1, " de lo que hacemos."],
    blanks: [
      { answer: "contaminación", credible: "tráfico", unrelated: "clima" },
      { answer: "ambiental", credible: "correo", unrelated: "folleto" }
    ] },
  { parts: ["Identificar y eliminar los ", 0, " antes de que ocurra un ", 1, "."],
    blanks: [
      { answer: "peligros", credible: "sellos", unrelated: "carteles" },
      { answer: "accidente", credible: "bono", unrelated: "ascenso" }
    ] },
  { parts: ["Proporcionar la ", 0, " y ", 1, " de todos los colaboradores porque su participación hace más seguro el trabajo."],
    blanks: [
      { answer: "participación", credible: "uniforme", unrelated: "clima" },
      { answer: "consulta", credible: "bono", unrelated: "permiso" }
    ] },
  { parts: ["Gestionar los riesgos de forma ", 0, ", con controles y medidas preventivas que aseguren la continuidad de nuestras ", 1, "."],
    blanks: [
      { answer: "proactiva", credible: "semanal", unrelated: "diario" },
      { answer: "operaciones", credible: "muebles", unrelated: "correos" }
    ] },
  { parts: ["Analizar, ", 0, " y actuar para ser mejores cada día."],
    blanks: [
      { answer: "prevenir", credible: "cobrar", unrelated: "viajar" }
    ] },
  { parts: ["Integrar prácticas de ", 0, " y eficiencia energética en nuestras operaciones."],
    blanks: [
      { answer: "innovación", credible: "correo", unrelated: "horario" }
    ] },
  { parts: ["Garantizar entornos laborales libres de ", 0, " y ", 1, ", con gestión de riesgos psicosociales con perspectiva de género."],
    blanks: [
      { answer: "acoso", credible: "correo", unrelated: "papel" },
      { answer: "violencia", credible: "bono", unrelated: "sello" }
    ] },
  { parts: ["Fortalecer ", 0, " en calidad, seguridad, salud y medio ambiente, promoviendo el compromiso con los objetivos del SGI."],
    blanks: [
      { answer: "competencias", credible: "correos", unrelated: "sellos" }
    ] }
];

const sentencesDiv = document.getElementById('sentences');
const nameInput = document.getElementById('nameInput');
const emailInput = document.getElementById('emailInput');
const contactCard = document.getElementById('contactCard');
const checkBtn = document.getElementById('checkBtn');
const result = document.getElementById('result');
const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const STORAGE_KEY = 'msoluciones_cuestionario_v1_state';
let submitted = false;

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSelect(blankData){
  const select = document.createElement('select');
  select.className = 'blank-select';
  select.dataset.answer = blankData.answer;

  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = '— elige —';
  placeholder.disabled = true;
  placeholder.selected = true;
  select.appendChild(placeholder);

  const options = shuffle([blankData.answer, blankData.credible, blankData.unrelated]);
  options.forEach(optText => {
    const opt = document.createElement('option');
    opt.value = optText;
    opt.textContent = optText;
    select.appendChild(opt);
  });

  select.addEventListener('change', () => {
    select.classList.remove('incorrect');
    saveState();
  });

  return select;
}

function buildRevealHTML(sentence){
  let html = '';
  sentence.parts.forEach(part => {
    if (typeof part === 'number') {
      html += `<strong>${sentence.blanks[part].answer}</strong>`;
    } else {
      html += part;
    }
  });
  return html;
}

function renderSentences(){
  sentencesDiv.innerHTML = '';
  sentences.forEach((s, sIndex) => {
    const card = document.createElement('div');
    card.className = 'card';

    const sentenceEl = document.createElement('div');
    sentenceEl.className = 'sentence';

    const numSpan = document.createElement('span');
    numSpan.className = 'num';
    numSpan.textContent = sIndex + 1;
    sentenceEl.appendChild(numSpan);

    s.parts.forEach(part => {
      if (typeof part === 'number') {
        sentenceEl.appendChild(buildSelect(s.blanks[part]));
      } else {
        sentenceEl.appendChild(document.createTextNode(part));
      }
    });

    const correctFeedback = document.createElement('div');
    correctFeedback.className = 'correct-feedback';
    correctFeedback.id = `correct-${sIndex}`;
    correctFeedback.innerHTML = `<span class="check-icon">&#10003;</span> Correcto`;
    card.appendChild(correctFeedback);

    card.appendChild(sentenceEl);
    sentencesDiv.appendChild(card);

    const reveal = document.createElement('div');
    reveal.className = 'reveal';
    reveal.id = `reveal-${sIndex}`;
    reveal.innerHTML = `<span class="reveal-label">Respuesta correcta</span>${buildRevealHTML(s)}`;
    sentencesDiv.appendChild(reveal);
  });
}

function saveState(){
  const cards = Array.from(sentencesDiv.querySelectorAll('.card:not(.contact-card)'));
  const state = {
    name: nameInput.value,
    email: emailInput.value,
    answers: cards.map(card => Array.from(card.querySelectorAll('.blank-select')).map(s => s.value)),
    submitted
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function clearContactInvalid(){
  nameInput.classList.remove('incorrect');
  emailInput.classList.remove('incorrect');
}

function validateContact(){
  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  if (!name || !email) return { ok:false, reason:'empty' };
  if (!emailRegex.test(email)) return { ok:false, reason:'invalid' };
  return { ok:true, reason:null };
}

function markContactInvalid(){
  if (!nameInput.value.trim()) nameInput.classList.add('incorrect');
  if (!emailInput.value.trim() || !emailRegex.test(emailInput.value.trim())) emailInput.classList.add('incorrect');
}

nameInput.addEventListener('input', () => { nameInput.classList.remove('incorrect'); saveState(); });
emailInput.addEventListener('input', () => { emailInput.classList.remove('incorrect'); saveState(); });

function finalizeSubmission(){
  const selects = document.querySelectorAll('.blank-select');
  const cards = Array.from(sentencesDiv.querySelectorAll('.card:not(.contact-card)'));

  let correctCount = 0;
  cards.forEach((card, cIndex) => {
    const cardSelects = card.querySelectorAll('.blank-select');
    let allCorrect = true;
    cardSelects.forEach(select => {
      select.classList.remove('incorrect');
      if (select.value !== select.dataset.answer) {
        allCorrect = false;
        select.classList.add('incorrect');
      }
    });
    if (allCorrect) {
      correctCount++;
      document.getElementById(`correct-${cIndex}`).classList.add('visible');
    } else {
      document.getElementById(`reveal-${cIndex}`).classList.add('visible');
    }
  });

  result.textContent = `Enviaste tus respuestas: ${correctCount} de ${cards.length} correctas.`;
  result.style.color = correctCount === cards.length ? 'var(--medium-light-green)' : 'var(--dark-green)';

  selects.forEach(select => { select.disabled = true; });
  nameInput.disabled = true;
  emailInput.disabled = true;
  checkBtn.style.display = 'none';

  submitted = true;
  saveState();
}

checkBtn.addEventListener('click', () => {
  const cards = Array.from(sentencesDiv.querySelectorAll('.card:not(.contact-card)'));

  document.querySelectorAll('.blank-select').forEach(select => select.classList.remove('incorrect'));
  clearContactInvalid();
  document.querySelectorAll('.reveal').forEach(r => r.classList.remove('visible'));
  document.querySelectorAll('.correct-feedback').forEach(c => c.classList.remove('visible'));

  const contactStatus = validateContact();
  const missingCardIndices = [];
  cards.forEach((card, cIndex) => {
    const hasEmpty = Array.from(card.querySelectorAll('.blank-select')).some(select => !select.value);
    if (hasEmpty) missingCardIndices.push(cIndex);
  });

  const problems = [];
  if (!contactStatus.ok) problems.push(0);
  missingCardIndices.forEach(i => problems.push(i + 1));

  if (problems.length > 0) {
    let targetEl;
    if (problems[0] === 0) {
      markContactInvalid();
      targetEl = contactCard;
    } else {
      targetEl = cards[problems[0] - 1];
      targetEl.querySelectorAll('.blank-select').forEach(select => {
        if (!select.value) select.classList.add('incorrect');
      });
    }

    if (problems[0] === 0 && contactStatus.reason === 'invalid') {
      result.textContent = problems.length > 1
        ? `Ingresa un correo válido. También faltan respuestas en la(s) pregunta(s): ${problems.slice(1).join(', ')}.`
        : 'Ingresa un correo válido.';
    } else {
      const labels = problems.map(p => p === 0 ? 'tus datos' : p);
      result.textContent = `Faltan respuestas por elegir en: ${labels.join(', ')}.`;
    }
    result.style.color = 'var(--incorrect)';

    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    saveState();
    return;
  }

  finalizeSubmission();
});

function restoreState(){
  const params = new URLSearchParams(location.search);
  if (params.has('reset')) {
    localStorage.removeItem(STORAGE_KEY);
    return;
  }

  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;

  let state;
  try { state = JSON.parse(raw); } catch (e) { return; }

  nameInput.value = state.name || '';
  emailInput.value = state.email || '';

  const cards = Array.from(sentencesDiv.querySelectorAll('.card:not(.contact-card)'));
  cards.forEach((card, idx) => {
    const savedVals = (state.answers && state.answers[idx]) || [];
    const cardSelects = card.querySelectorAll('.blank-select');
    cardSelects.forEach((select, i) => {
      const val = savedVals[i];
      const optionExists = val && Array.from(select.options).some(opt => opt.value === val);
      if (optionExists) select.value = val;
    });
  });

  if (state.submitted) {
    finalizeSubmission();
  }
}

renderSentences();
restoreState();
</script>

</body>
</html>
